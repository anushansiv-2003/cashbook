<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Cashbook</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="A personal cash ledger with per-account tracking, synced live across devices." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📒</text></svg>" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f6b5c" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Cashbook" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <h1>Cashbook</h1>
    <div class="sub">Sign in to your ledger.</div>
    <div class="login-error" id="loginError"></div>
    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn-primary" id="loginBtn">Sign in</button>
    </form>
    <div class="login-hint">You'll stay signed in on this device.</div>
  </div>
</div>

<!-- APP -->
<div class="app-shell hidden" id="appShell">
  <div class="topbar">
    <h1>Cashbook</h1>
    <div class="topbar-right">
      <div class="role-pill" id="rolePill" data-state="idle"><span class="dot"></span><span id="roleText">—</span></div>
      <button type="button" class="signout-btn" id="signOutBtn" title="Sign out" aria-label="Sign out"></button>
    </div>
  </div>
  <div class="banner" id="banner"></div>

  <main class="views">
    <!-- ADD -->
    <section class="view active" id="view-add">
      <div id="addEditor">
        <div class="pill-row" id="addAcctPills"></div>
        <div class="type-toggle" id="typeToggle">
          <button type="button" data-type="in">Cash In</button>
          <button type="button" data-type="out">Cash Out</button>
        </div>
        <form id="addForm">
          <div class="amount-field">
            <div class="amount-wrap">
              <span class="rs">Rs</span>
              <input id="amountInput" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00" required autocomplete="off" />
            </div>
          </div>
          <div class="field">
            <label for="descInput">Description <span style="font-weight:400;color:var(--text-muted);">(optional)</span></label>
            <input id="descInput" type="text" maxlength="120" placeholder="e.g. lunch with client" />
          </div>
          <div class="row-2">
            <div class="field">
              <label for="dateInput">Date</label>
              <input id="dateInput" type="date" required />
            </div>
            <div class="field">
              <label for="timeInput">Time</label>
              <input id="timeInput" type="time" required />
            </div>
          </div>
          <div class="form-error" id="formError"></div>
          <button type="submit" class="btn-primary" id="submitBtn">Add entry</button>
        </form>
        <div class="recent-block">
          <h2 class="section-title">Just added</h2>
          <div id="recentList"></div>
        </div>
      </div>
      <div id="viewerNotice" class="viewer-notice hidden"></div>
    </section>

    <!-- LEDGER -->
    <section class="view" id="view-ledger">
      <div class="pill-row" id="ledgerAcctPills"></div>
      <div class="balance-card">
        <div class="label" id="ledgerBalanceLabel">Balance</div>
        <div class="value num" id="ledgerBalance">Rs 0.00</div>
        <div class="balance-grid">
          <div class="mini in"><div class="k">Cash in</div><div class="v num" id="ledgerIn">Rs 0.00</div></div>
          <div class="mini out"><div class="k">Cash out</div><div class="v num" id="ledgerOut">Rs 0.00</div></div>
        </div>
      </div>
      <div class="controls-row">
        <select class="period-select" id="periodSelect"></select>
        <span class="entry-count" id="entryCount"></span>
      </div>
      <div id="ledgerBody"></div>
    </section>

    <!-- REPORTS -->
    <section class="view" id="view-reports">
      <div class="field">
        <label for="reportAcctSelect">Account</label>
        <select id="reportAcctSelect"></select>
      </div>
      <div class="field-label">Period</div>
      <div class="preset-row" id="presetRow"></div>
      <div class="row-2" id="customRangeRow" style="display:none;">
        <div class="field"><label for="fromDate">From</label><input id="fromDate" type="date" /></div>
        <div class="field"><label for="toDate">To</label><input id="toDate" type="date" /></div>
      </div>
      <div id="statementArea"></div>
    </section>

    <!-- ACCOUNTS -->
    <section class="view" id="view-accounts">
      <div class="total-card">
        <div class="label">Total balance</div>
        <div class="value num" id="totalBalance">Rs 0.00</div>
        <div class="sub" id="totalSub">across all accounts</div>
      </div>
      <h2 class="section-title">Accounts</h2>
      <div id="accountsList"></div>
      <div class="add-account-card hidden" id="addAccountCard">
        <div class="field-label">Add an account</div>
        <div class="add-account-row">
          <input id="newAccountInput" type="text" maxlength="40" placeholder="e.g. Savings, Credit Card" />
          <button type="button" id="addAccountBtn">Add</button>
        </div>
      </div>
    </section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="add" class="active"></button>
    <button data-tab="ledger"></button>
    <button data-tab="reports"></button>
    <button data-tab="accounts"></button>
  </nav>
</div>

<div id="printArea" class="print-only"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script type="module" src="js/app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("service-worker.js").catch(function () {});
    });
  }
</script>
</body>
</html>
